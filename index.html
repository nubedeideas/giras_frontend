<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Consent Mode (debe declararse antes de que cargue GTM) ── -->
    <script>
      window.dataLayer = window.dataLayer || []
      window.gtag = function () {
        window.dataLayer.push(arguments)
      }
      window.gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      })
    </script>
    <!-- ── Google Tag Manager ── -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-P7NTLSLC')
    </script>
    <!-- ── End Google Tag Manager ── -->

    <!-- ── Identidad ── -->
    <title>Giras — GigSync</title>
    <meta name="description" content="Automatiza la comunicación logística de tu gira. Sin caos." />
    <meta name="application-name" content="GigSync" />
    <meta name="author" content="GigSync" />

    <!-- ── Theme color (chrome/safari top bar) ── -->
    <meta name="theme-color" content="#0c0c0f" />
    <meta name="color-scheme" content="dark" />

    <!-- ── Favicons ── -->
    <!-- SVG: navegadores modernos (Chrome 80+, Firefox, Safari 9+) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ICO: fallback para navegadores legacy e IE -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <!-- PNG 32×32: Chrome legacy, algunos launchers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- PNG 16×16: sitios donde se muestran íconos pequeños -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- ── Apple / iOS ── -->
    <!-- apple-touch-icon: ícono al añadir a pantalla de inicio en iOS/iPadOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Safari pinned tab (macOS) -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#a8d800" />
    <!-- Desactiva detección automática de teléfonos en Safari iOS -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Oculta la barra del navegador al abrir desde pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GigSync" />

    <!-- ── PWA Manifest ── -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph (WhatsApp, Slack, Twitter previews) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://giras.pro/" />
    <meta property="og:title" content="Giras — GigSync" />
    <meta property="og:description" content="Automatiza la comunicación logística de tu gira. Sin caos." />
    <meta property="og:image" content="https://giras.pro/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Giras — GigSync" />
    <meta name="twitter:description" content="Automatiza la comunicación logística de tu gira. Sin caos." />
    <meta name="twitter:image" content="https://giras.pro/og-image.png" />

    <!-- ── Canonical (rutas específicas lo sobreescriben en runtime vía @unhead/vue) ── -->
    <link rel="canonical" href="https://giras.pro/" />

    <!-- ── Fuentes ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-P7NTLSLC"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
