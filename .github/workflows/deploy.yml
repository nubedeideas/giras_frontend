name: Deploy frontend (giras.pro)

# Build estática (vite-ssg) en Actions y subida por rsync al site de CloudPanel
# giras.pro (usuario giras-web). nginx sirve la carpeta dist directamente, no hay
# proceso Node en producción.
#
# Disparo manual (workflow_dispatch) y gate por variable del repo DEPLOY_FRONTEND_ENABLED,
# igual que el backend. Variables (no secretos, se incrustan en el bundle público):
#   VITE_API_URL, VITE_GOOGLE_CLIENT_ID
# Secretos del environment production:
#   VPS_HOST, VPS_PORT, VPS_USER (giras-web), VPS_SSH_KEY, VPS_KNOWN_HOSTS, DEPLOY_PATH
#   (DEPLOY_PATH: carpeta dist absoluta, p. ej. /home/giras-web/htdocs/giras.pro/dist)

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Variables de build
        run: |
          test -n "${{ vars.VITE_API_URL }}" || { echo "Falta la variable VITE_API_URL"; exit 1; }
          test -n "${{ vars.VITE_GOOGLE_CLIENT_ID }}" || { echo "Falta la variable VITE_GOOGLE_CLIENT_ID"; exit 1; }
          printf 'VITE_API_URL=%s\nVITE_GOOGLE_CLIENT_ID=%s\n' \
            "${{ vars.VITE_API_URL }}" "${{ vars.VITE_GOOGLE_CLIENT_ID }}" > .env.production

      - name: Lint
        run: pnpm exec eslint src --ext .vue,.js,.ts

      - name: Build (vue-tsc + vite-ssg)
        run: pnpm build

      - name: Comprobar la build
        run: |
          test -f dist/index.html
          grep -q "${{ vars.VITE_API_URL }}" dist/assets/*.js || { echo "VITE_API_URL no aparece en el bundle"; exit 1; }
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_FRONTEND_ENABLED == 'true'
    environment:
      name: production
      url: https://giras.pro
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Clave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Subir dist por rsync
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Falta el secreto DEPLOY_PATH"; exit 1; }
          case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH debe ser absoluto"; exit 1;; esac
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:$DEPLOY_PATH/"

      - name: Smoke test público
        run: |
          curl -fsS --retry 6 --retry-delay 5 -o /dev/null https://giras.pro/
          curl -fsS https://giras.pro/ | grep -q "${{ vars.VITE_API_URL }}" \
            || { echo "La home publicada no contiene VITE_API_URL esperado"; exit 1; }
          curl -fsS -o /dev/null https://giras.pro/soporte/
          echo "Frontend desplegado"
