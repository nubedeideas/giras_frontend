# Vhost del site de CloudPanel giras.pro (usuario giras-web). Sustituye al reverse proxy a
# vite preview (pm2, puerto 3066): nginx sirve directamente la build estática que sube
# .github/workflows/deploy.yml por rsync a DEPLOY_PATH (/home/giras-web/htdocs/giras.pro/dist).
# Las líneas {{...}} las gestiona CloudPanel: no tocarlas.

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name giras.pro www.giras.pro;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$uri permanent;
  }

  # www -> raiz
  if ($host = "www.giras.pro") {
    return 301 https://giras.pro$request_uri;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # Bundles con hash en el nombre: cache larga e inmutable.
  location ^~ /assets/ {
    root /home/giras-web/htdocs/giras.pro/dist;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # HTML pre-renderizado por vite-ssg (/, /landing/, /soporte/, /terminos-y-condiciones/)
  # y fallback a index.html para las rutas SPA del dashboard (/login, /calendar, ...).
  location / {
    root /home/giras-web/htdocs/giras.pro/dist;
    # $uri/index.html antes que $uri/ evita el 301 a la barra final en las rutas
    # prerenderizadas (/privacy, /terms...): Google comprueba esas URLs sin barra.
    try_files $uri $uri/index.html $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
